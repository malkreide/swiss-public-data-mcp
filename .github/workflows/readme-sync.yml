name: Portfolio sync

# Fails if generated artefacts drift from portfolio.json (the source of truth):
#   * README.md / README.de.md  -> python scripts/generate_readme.py
#   * registry/*/server.json    -> python scripts/generate_server_json.py
#   * docs/INSTALL.md           -> python scripts/generate_install_snippets.py
#   * PROMOTION.md              -> python scripts/generate_promotion.py
#   * docs/showcase-card.html   -> python scripts/generate_showcase_card.py
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate portfolio.json
        run: python -c "import json; json.load(open('portfolio.json'))"
      # Ein portfolioweiter Sweep meldete "33 von 33 ok", waehrend portfolio.json
      # 43 aktive Server fuehrte: zehn waren nie in der Zielliste, darunter
      # meteoswiss-mcp. Die Zielliste kommt seither von hier, und dieser Schritt
      # haelt das Feld gueltig. Nur Struktur, kein Netz — ob die Distribution auf
      # dem Index liegt, prueft der Nightly (index-presence.yml).
      - name: Check pypi_dist coverage field
        run: python scripts/coverage_manifest.py --check
      - name: Check READMEs are in sync with portfolio.json
        run: python scripts/generate_readme.py --check
      - name: Check registry server.json files are in sync with portfolio.json
        run: python scripts/generate_server_json.py --check
      - name: Check install snippets are in sync with portfolio.json
        run: python scripts/generate_install_snippets.py --check
      - name: Check PROMOTION.md is in sync with portfolio.json
        run: python scripts/generate_promotion.py --check
      - name: Check showcase card HTML is in sync with portfolio.json
        run: python scripts/generate_showcase_card.py --check
